[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sasm-ecg"
version = "1.3.0"
description = "Cached-feature reproduction for source-anchored ECG adaptation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "threadpoolctl>=3,<4"]

[tool.setuptools]
packages = ["sasm"]
